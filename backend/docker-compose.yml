services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anniymah
      POSTGRES_PASSWORD: anniymah_dev
      POSTGRES_DB: anniymah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anniymah -d anniymah"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
